[project]
name = "refugia"
version = "0.1.0"
description = "Rank US places to live against a personal allergen, wellbeing and cost profile."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "openpyxl>=3.1",
]

[project.scripts]
refugia = "refugia.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pylint>=3.2",
    "ruff>=0.5",
    "black>=24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/refugia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=refugia --cov-report=term-missing"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "C90", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pylint.main]
load-plugins = ["pylint.extensions.mccabe"]
max-complexity = 10

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages control"]
disable = ["too-few-public-methods"]

# Test modules are written against pytest's idioms: a fixture is *meant* to shadow
# its own name in the signature of every test that requests it, and a test's name
# is its documentation. Enforcing the library rules here reports the framework as
# a defect on every file.
[tool.pylint.tests]
ignore-paths = ["tests/.*"]

[tool.black]
line-length = 100
