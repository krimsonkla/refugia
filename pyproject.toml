[project]
name = "refugia"
version = "0.1.0"
description = "Rank US places to live against a personal allergen, wellbeing and cost profile."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "openpyxl>=3.1",
]

authors = [{ name = "Jason Risch" }]
keywords = ["counties", "relocation", "allergens", "census", "data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/krimsonkla/refugia"
Source = "https://github.com/krimsonkla/refugia"
Issues = "https://github.com/krimsonkla/refugia/issues"

[project.scripts]
refugia = "refugia.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pylint>=3.2",
    "ruff>=0.5",
    "black>=24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/refugia"]

# Only the wheel target was configured, so the sdist carried everything tracked --
# including docs/data, a working ledger of open findings written for this repository
# rather than for whoever runs `pip download refugia`.
[tool.hatch.build.targets.sdist]
exclude = ["/docs/data", "/docs/*.jpg", "/.github", "/devenv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Coverage is not in addopts: with it there, running one file reports a
# project-wide total measured from that file alone, which reads as a collapse and
# is only an artefact. CI passes the flags explicitly, so the number is produced
# exactly once, over the whole suite.
filterwarnings = ["error"]

[tool.coverage.run]
source = ["refugia"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "C90", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pylint.main]
load-plugins = ["pylint.extensions.mccabe"]
max-complexity = 10

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages control"]
disable = ["too-few-public-methods"]

# Test modules are written against pytest's idioms: a fixture is *meant* to shadow
# its own name in the signature of every test that requests it, and a test's name
# is its documentation. Enforcing the library rules here reports the framework as
# a defect on every file.
[tool.pylint.tests]
ignore-paths = ["tests/.*"]

[tool.black]
line-length = 100
# Pinned, or black targets the newest Python it knows and then warns that the
# running interpreter cannot parse what it just formatted -- which also means it
# skips the AST-equivalence check it prints the warning about.
target-version = ["py312"]
